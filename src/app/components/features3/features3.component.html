<div class="p-6 bg-pink-100">
    <h1 class="text-center text-lg font-bold mb-4">Оренда будівельної техніки</h1>
    <p class="text-center mb-6">
        Надійна техніка для будь-яких будівельних завдань. Орендуйте у нас та отримайте якісне обслуговування і підтримку.
    </p>

    <!-- Сетка карточек -->
    <div
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 justify-items-center"
    >
        <!-- Отображаем первые 4 или все в зависимости от isExpanded -->
        <ng-container *ngFor="let item of (isExpanded ? equipment : equipment.slice(0, itemsToShow))">
            <div
                    class="bg-white shadow-md rounded-lg p-6 text-center cursor-pointer"
                    (click)="openModal(item)"
            >
                <img
                        [src]="item.image"
                        alt="{{ item.name }}"
                        class="w-full h-80 object-cover rounded-md mb-4"
                />
                <h2 class="font-semibold">{{ item.name }}</h2>
                <p class="text-gray-600">{{ item.model }}</p>
            </div>
        </ng-container>
    </div>

    <!-- Кнопка "Показати більше / Сховати" -->
    <div class="text-center mt-4">
        <button
                (click)="toggleView()"
                class="bg-orange-500 text-white py-2 px-6 rounded-md hover:bg-orange-600"
        >
            {{ isExpanded ? 'Сховати' : 'Показати більше' }}
        </button>
    </div>

    <!-- Модальное окно -->
    <div
            *ngIf="isModalOpen"
            class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
    >
        <div class="bg-white rounded-lg shadow-lg p-6 w-11/12 sm:w-3/4 lg:w-1/2 flex flex-col lg:flex-row">
            <!-- Картинка только для ПК -->
            <div class="hidden lg:block lg:w-1/3">
                <img
                        [src]="selectedItem?.image"
                        alt="{{ selectedItem?.name }}"
                        class="w-full h-full rounded-md"
                />
            </div>

            <!-- Контент модального окна -->
            <div class="lg:w-2/3 lg:pl-6">
                <h2 class="text-xl font-bold mb-4">{{ selectedItem?.name }} {{ selectedItem?.model }}</h2>
                <p class="text-gray-700 mb-6">{{ selectedItem?.description }}</p>
                <div class="flex justify-end">
                    <button
                            (click)="closeModal()"
                            class="bg-red-500 text-white py-2 px-6 rounded-md hover:bg-red-600 mr-2"
                    >
                        Закрити
                    </button>
                    <button
                            (click)="closeModal()"
                            class="bg-blue-500 text-white py-2 px-6 rounded-md hover:bg-blue-600"
                    >
                        Ок
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
